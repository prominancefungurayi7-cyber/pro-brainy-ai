{% extends 'base.html' %}

{% block content %}

<div class="tool-container">
    <h1>AI Humanizer</h1>
    <p class="lead">Paste text or upload a .txt or .pdf file to humanize it. Upload a .docx file to download an edited Word document with headings and document order preserved.</p>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="text">Text to humanize</label>
            <textarea id="text" name="text" rows="12" placeholder="Paste AI-generated text here..."></textarea>
        </div>
        <div class="form-group">
            <label for="file">Upload file</label>
            <input id="file" type="file" name="file" accept=".txt,.pdf,.docx">
        </div>
        <div class="form-group">
            <label for="education_level">Education level</label>
            <select id="education_level" name="education_level">
                <option value="Primary school">Primary school</option>
                <option value="O level">O level</option>
                <option value="A level">A level</option>
                <option value="Tertiary education">Tertiary education</option>
            </select>
        </div>
        <button type="submit">Humanize Text</button>
    </form>

    {% if output %}
    <div class="output-box">
        <h2>Humanized Output</h2>
        <pre>{{ output }}</pre>

        <form method="POST" action="{{ url_for('humanizer.humanizer_download') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
            <textarea name="download_content" hidden>{{ output }}</textarea>
            <input type="hidden" name="download_filename" value="humanized.txt">
            <button type="submit">Download Humanized File</button>
        </form>
    </div>
    {% endif %}
</div>

{% endblock %}

{% extends 'base.html' %}
{% block title %}Log in | Pro Brainy AI{% endblock %}
{% block topbar_title %}Welcome back{% endblock %}

{% block content %}

<div class="auth-container">
    <h1>Login</h1>
    <p class="lead">Access your toolkit dashboard and manage your AI writing workflows.</p>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.register') }}">Create an account →</a></p>
</div>

{% endblock %}
